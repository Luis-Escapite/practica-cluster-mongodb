version: '3.8'

networks:
  cluster-net:
    driver: bridge

services:
  # 1. Servidor de Configuracion (Guarda los metadatos del cluster)
  configSrv:
    image: mongo:latest
    container_name: configSrv
    command: ["mongod", "--configsvr", "--replSet", "configReplSet", "--port", "27019"]
    ports:
      - "27019:27019"
    networks:
      - cluster-net

  # 2. Shard 1 (Primer nodo de almacenamiento fragmentado)
  shard1:
    image: mongo:latest
    container_name: shard1
    command: ["mongod", "--shardsvr", "--replSet", "shard1ReplSet", "--port", "27018"]
    ports:
      - "27018:27018"
    networks:
      - cluster-net

  # 3. Shard 2 (Segundo nodo de almacenamiento fragmentado)
  shard2:
    image: mongo:latest
    container_name: shard2
    command: ["mongod", "--shardsvr", "--replSet", "shard2ReplSet", "--port", "27018"]
    ports:
      - "27020:27018"
    networks:
      - cluster-net

  # 4. Shard 3 (Tercer nodo de almacenamiento fragmentado)
  shard3:
    image: mongo:latest
    container_name: shard3
    command: ["mongod", "--shardsvr", "--replSet", "shard3ReplSet", "--port", "27018"]
    ports:
      - "27021:27018"
    networks:
      - cluster-net

  # 5. Mongos Router (El punto de entrada unificado para las consultas)
  router:
    image: mongo:latest
    container_name: router
    command: ["mongos", "--configdb", "configReplSet/configSrv:27019", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    networks:
      - cluster-net
    depends_on:
      - configSrv
      - shard1
      - shard2
      - shard3